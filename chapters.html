<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Персонажи — Пока мы спим...</title>

<style>

/* =========================
   FONTS
========================= */

@font-face {
    font-family: "Cinzel";
    src: url("cinzel_regular.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}

@font-face {
    font-family: "Comfortaa";
    src: url("Comfortaa.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}


/* =========================
   BASE
========================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(185, 165, 141, 0.055),
            transparent 38%
        ),
        #0b0b0d;
    color: #e8e5e0;
    font-family: "Comfortaa", sans-serif;
    font-size: 15px;
    line-height: 1.7;
}

body.modal-open {
    overflow: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

img {
    max-width: 100%;
}


/* =========================
   HEADER
========================= */

.site-header {
    width: 100%;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    background: rgba(11, 11, 13, 0.92);
}

.header-inner {
    width: min(1200px, calc(100% - 40px));
    margin: 0 auto;
    min-height: 78px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
}

.logo {
    font-family: "Cinzel", serif;
    font-size: 17px;
    letter-spacing: 0.12em;
    white-space: nowrap;
}

.logo span {
    color: #a9a6a0;
}

.main-nav {
    display: flex;
    align-items: center;
    gap: 30px;
}

.main-nav a {
    position: relative;
    color: #a9a6a0;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 0.25s ease;
}

.main-nav a::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -9px;

    height: 1px;
    background: #b9a58d;

    transform: scaleX(0);
    transform-origin: center;
    transition: transform 0.25s ease;
}

.main-nav a:hover,
.main-nav a.active {
    color: #e8e5e0;
}

.main-nav a:hover::after,
.main-nav a.active::after {
    transform: scaleX(1);
}


/* =========================
   MAIN
========================= */

.page {
    width: min(1100px, calc(100% - 40px));
    margin: 0 auto;
    padding: 90px 0 110px;
}


/* =========================
   INTRO
========================= */

.page-intro {
    max-width: 720px;
    margin-bottom: 65px;
}

.eyebrow {
    margin: 0 0 15px;

    color: #b9a58d;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
}

.page-title {
    margin: 0 0 22px;

    font-family: "Cinzel", serif;
    font-size: clamp(38px, 6vw, 62px);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: 0.02em;
}

.page-description {
    max-width: 650px;
    margin: 0;

    color: #a9a6a0;
    font-size: 14px;
    line-height: 1.9;
}


/* =========================
   CHARACTERS
========================= */

.characters-list {
    display: flex;
    flex-direction: column;
    gap: 28px;
}


/* =========================
   CHARACTER CARD
========================= */

.character-card {
    position: relative;

    display: grid;
    grid-template-columns: 190px minmax(0, 1fr);

    min-height: 250px;

    overflow: hidden;

    border: 1px solid rgba(255, 255, 255, 0.075);
    background:
        linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.035),
            rgba(255, 255, 255, 0.012)
        );

    box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);

    transition:
        border-color 0.3s ease,
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

.character-card:hover {
    transform: translateY(-3px);

    border-color: rgba(185, 165, 141, 0.28);

    box-shadow:
        0 30px 70px rgba(0, 0, 0, 0.32),
        0 0 35px rgba(185, 165, 141, 0.035);
}


/* =========================
   DECORATIVE NUMBER
========================= */

.character-number {
    position: absolute;
    top: 18px;
    right: 22px;

    color: rgba(185, 165, 141, 0.22);

    font-family: "Cinzel", serif;
    font-size: 42px;
    line-height: 1;
    letter-spacing: 0.03em;

    pointer-events: none;
}


/* =========================
   IMAGE
========================= */

.character-image {
    position: relative;
    min-height: 250px;
    overflow: hidden;

    background: #151519;
}

.character-image::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            90deg,
            transparent 65%,
            rgba(11, 11, 13, 0.45)
        ),
        linear-gradient(
            0deg,
            rgba(11, 11, 13, 0.28),
            transparent 35%
        );

    pointer-events: none;
}

.character-image img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    filter: saturate(0.82) contrast(1.04);

    transition:
        transform 0.6s ease,
        filter 0.6s ease;
}

.character-card:hover .character-image img {
    transform: scale(1.035);
    filter: saturate(0.92) contrast(1.06);
}


/* =========================
   CONTENT
========================= */

.character-content {
    position: relative;

    display: flex;
    flex-direction: column;

    padding: 34px 55px 32px 38px;
}

.character-role {
    margin-bottom: 7px;

    color: #b9a58d;

    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
}

.character-name {
    margin: 0 0 18px;

    font-family: "Cinzel", serif;
    font-size: 29px;
    font-weight: 400;
    line-height: 1.15;
}

.character-divider {
    width: 55px;
    height: 1px;

    margin-bottom: 19px;

    background: rgba(185, 165, 141, 0.55);
}

.character-description {
    max-width: 650px;
    margin: 0 0 18px;

    color: #aaa7a1;

    font-size: 13px;
    line-height: 1.85;
}

.character-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 24px;

    margin-bottom: 23px;

    color: #77747a;
    font-size: 11px;
}

.character-meta strong {
    color: #c4c0b9;
    font-weight: 400;
}


/* =========================
   BUTTON
========================= */

.character-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;

    width: fit-content;

    margin-top: auto;

    padding: 0;

    border: 0;
    background: transparent;

    color: #c7c1b8;

    font-family: "Comfortaa", sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;

    cursor: pointer;

    transition: color 0.25s ease;
}

.character-link::after {
    content: "→";

    color: #b9a58d;

    transition: transform 0.25s ease;
}

.character-link:hover {
    color: #ffffff;
}

.character-link:hover::after {
    transform: translateX(5px);
}


/* =========================
   MODAL
========================= */

.character-modal {
    position: fixed;
    inset: 0;
    z-index: 9999;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px;

    background: rgba(0, 0, 0, 0.78);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
}

.character-modal.active {
    opacity: 1;
    visibility: visible;
}


/* =========================
   MODAL WINDOW
========================= */

.character-modal-window {
    position: relative;

    width: min(900px, 100%);
    max-height: min(850px, calc(100vh - 60px));

    overflow-y: auto;

    border: 1px solid rgba(185, 165, 141, 0.22);

    background:
        radial-gradient(
            circle at 0% 0%,
            rgba(185, 165, 141, 0.07),
            transparent 35%
        ),
        #111114;

    box-shadow:
        0 40px 100px rgba(0, 0, 0, 0.65),
        0 0 60px rgba(0, 0, 0, 0.3);

    transform: translateY(25px) scale(0.98);

    transition:
        transform 0.35s ease;
}

.character-modal.active .character-modal-window {
    transform: translateY(0) scale(1);
}


/* =========================
   MODAL CLOSE
========================= */

.character-modal-close {
    position: absolute;
    top: 17px;
    right: 20px;

    z-index: 5;

    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(11, 11, 13, 0.72);

    color: #aaa7a1;

    font-family: Arial, sans-serif;
    font-size: 25px;
    font-weight: 200;
    line-height: 1;

    cursor: pointer;

    transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease;
}

.character-modal-close:hover {
    background: rgba(185, 165, 141, 0.12);
    border-color: rgba(185, 165, 141, 0.35);
    color: #ffffff;
}


/* =========================
   MODAL IMAGE
========================= */

.character-modal-image {
    float: left;

    width: 210px;
    height: 280px;

    margin: 0 32px 20px 0;

    overflow: hidden;

    background: #151519;
}

.character-modal-image img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    filter: saturate(0.82) contrast(1.04);
}


/* =========================
   MODAL CONTENT
========================= */

.character-modal-content {
    padding: 40px 55px 50px;
    overflow: auto;
}

.character-modal-role {
    margin-bottom: 6px;

    color: #b9a58d;

    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
}

.character-modal-name {
    margin: 0 0 12px;

    font-family: "Cinzel", serif;
    font-size: clamp(30px, 5vw, 48px);
    font-weight: 400;
    line-height: 1.1;
}

.character-modal-divider {
    width: 65px;
    height: 1px;

    margin-bottom: 16px;

    background: rgba(185, 165, 141, 0.55);
}


/* =========================
   MODAL META
========================= */

.character-modal-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 35px;

    margin-bottom: 32px;

    color: #77747a;

    font-size: 11px;
}

.character-modal-meta strong {
    color: #c4c0b9;
    font-weight: 400;
}


/* =========================
   FULL DESCRIPTION
========================= */

.character-modal-text {
    color: #aaa7a1;

    font-size: 14px;
    line-height: 0.2;

    white-space: pre-line;
}

.character-modal-text p {
    margin: 0 0 10px;
    line-height: 1.75;
}

.character-modal-text p:last-child {
    margin-bottom: 0;
}


/* =========================
   CONTACTS
========================= */

.contacts {
    margin-top: 105px;
    padding-top: 35px;

    border-top: 1px solid rgba(255, 255, 255, 0.06);

    text-align: center;
}

.contacts-title {
    margin: 0 0 18px;

    color: #69676a;

    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
}

.contacts-links {
    display: flex;
    justify-content: center;
    gap: 30px;
}

.contacts-links a {
    color: #a9a6a0;

    font-size: 12px;

    transition: color 0.25s ease;
}

.contacts-links a:hover {
    color: #e8e5e0;
}


/* =========================
   FOOTER
========================= */

.site-footer {
    padding: 30px 20px 45px;

    border-top: 1px solid rgba(255, 255, 255, 0.05);

    color: #56545a;

    font-size: 10px;
    letter-spacing: 0.08em;

    text-align: center;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .header-inner {
        min-height: auto;
        padding: 22px 0;

        flex-direction: column;
        gap: 20px;
    }

    .main-nav {
        width: 100%;
        justify-content: center;
        gap: 22px;
    }

    .page {
        padding: 65px 0 80px;
    }

    .page-intro {
        margin-bottom: 45px;
    }

    .character-card {
        grid-template-columns: 145px minmax(0, 1fr);
        min-height: 220px;
    }

    .character-image {
        min-height: 220px;
    }

    .character-content {
        padding: 27px 32px 27px 25px;
    }

    .character-name {
        font-size: 24px;
    }

    .character-number {
        top: 14px;
        right: 16px;
        font-size: 30px;
    }

    .character-modal {
        padding: 20px;
    }

    .character-modal-window {
        max-height: calc(100vh - 40px);
    }

    .character-modal-image {
        height: 270px;
    }

    .character-modal-content {
        padding: 35px 35px 40px;
    }
}


@media (max-width: 600px) {

    .header-inner,
    .page {
        width: min(100% - 28px, 1100px);
    }

    .main-nav {
        gap: 17px;
    }

    .main-nav a {
        font-size: 10px;
        letter-spacing: 0.05em;
    }

    .page-title {
        font-size: 40px;
    }

    .page-description {
        font-size: 13px;
    }

    .character-card {
        grid-template-columns: 115px minmax(0, 1fr);
        min-height: 190px;
    }

    .character-image {
        min-height: 190px;
    }

    .character-content {
        padding: 24px 20px 22px;
    }

    .character-role {
        font-size: 8px;
        letter-spacing: 0.13em;
    }

    .character-name {
        margin-bottom: 13px;
        font-size: 21px;
    }

    .character-divider {
        width: 38px;
        margin-bottom: 13px;
    }

    .character-description {
        font-size: 11px;
        line-height: 1.65;
    }

    .character-meta {
        margin-bottom: 16px;
        font-size: 9px;
    }

    .character-link {
        font-size: 9px;
    }

    .character-number {
        display: none;
    }

    .character-modal {
        padding: 12px;
    }

    .character-modal-window {
        max-height: calc(100vh - 24px);
    }

    .character-modal-image {
        height: 220px;
    }

    .character-modal-content {
        padding: 28px 22px 32px;
    }

    .character-modal-name {
        font-size: 32px;
    }

    .character-modal-text {
        font-size: 12px;
        line-height: 0.2;
    }

    .character-modal-meta {
        display: block;
        font-size: 10px;
    }

    .character-modal-meta span {
        margin-bottom: 6px;
    }

    .character-modal-close {
        top: 10px;
        right: 10px;
    }
}


@media (max-width: 430px) {

    .main-nav {
        flex-wrap: wrap;
        row-gap: 10px;
    }

    .page {
        padding-top: 50px;
    }

    .characters-list {
        gap: 18px;
    }

    .character-card {
        grid-template-columns: 100px minmax(0, 1fr);
    }

    .character-image {
        min-height: 175px;
    }

    .character-content {
        padding: 20px 15px;
    }

    .character-name {
        font-size: 18px;
    }

    .character-description {
        font-size: 10px;
    }

    .character-meta {
        display: block;
    }

    .character-meta span {
        display: block;
        margin-bottom: 3px;
    }

    .character-modal-image {
        height: 190px;
    }

    .character-modal-content {
        padding: 25px 18px 30px;
    }

    .character-modal-name {
        font-size: 28px;
    }
	.character-modal-image {
    width: 135px;
    height: 180px;

    margin: 0 20px 14px 0;
}
}

</style>
</head>

    <div class="header-inner">

</body>
